{% extends 'base.html' %}
{% block title %}Delete Note{% endblock %}
{% block content %}
    <h1>Delete"{{note.title}}?"</h1>
    <p>This action cannot be undone</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn danger">Yes, delete</button>
        <a class="btn secondary" href="{% url 'note_detail' note.id %}">Cancel</a>
    </form>
{% endblock %}
