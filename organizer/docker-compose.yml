services:
  db:
    image: postgres:16
    container_name: notes_postgres
    restart: always
    environment:
      POSTGRES_DB: academic_notes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: notes_django
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_NAME: academic_notes_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
